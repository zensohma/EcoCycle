[project]
name = "ecocycle-backend"
version = "0.1.0"
description = "EcoCycle bank sampah backend service"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.30.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "sqlalchemy==2.0.*",
    "alembic==1.13.*",
    "pymysql==1.*",
    "argon2-cffi==25.*",
    "email-validator==2.*",
    "pyjwt==2.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "httpx==0.27.*",
    "ruff==0.6.*",
    "mypy==1.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["app", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
